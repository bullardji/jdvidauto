version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      # Database
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}

      # Queue mode
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379

      # General
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Los_Angeles}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-changeme}

      # Allow local file access for clip processing
      N8N_USER_FOLDER: /home/node
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data:/data
      - ./config/watermark:/data/watermark
      - ./scripts:/scripts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    command: worker
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Los_Angeles}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data:/data
      - ./config/watermark:/data/watermark
      - ./scripts:/scripts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  clip-processor:
    build:
      context: .
      dockerfile: Dockerfile.processor
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./config/watermark:/data/watermark
      - ./scripts:/scripts
    environment:
      WATERMARK_PATH: ${WATERMARK_PATH:-/data/watermark/julian_dorey_watermark.png}
      WATERMARK_SCALE: ${WATERMARK_SCALE:-0.25}
      WATERMARK_OPACITY: ${WATERMARK_OPACITY:-0.8}
      MIN_EPISODE_NUMBER: ${MIN_EPISODE_NUMBER:-343}
      CLIPS_INPUT_DIR: ${CLIPS_INPUT_DIR:-/data/clips-input}
      CLIPS_PROCESSED_DIR: ${CLIPS_PROCESSED_DIR:-/data/clips-processed}
    command: >
      python /scripts/watch_and_process.py

volumes:
  postgres_data:
  redis_data:
  n8n_data:
